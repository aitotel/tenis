<style>
  :root {
    --bg: #f3f6f2; --card: #ffffff; --text: #1d2a1f; --muted: #66756a;
    --line: #dfe6de; --green: #2f7d32; --green-soft: #e3f1e3;
    --blue: #1e3a5f; --blue-soft: #e4ecf7; --blue-bar: #3b6fb6;   /* azul = informativo; verde = se puede pulsar */
    --orange: #d9822b; --orange-soft: #fbeedd; --red: #c0392b; --ball: #d4e157;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { color-scheme: dark;
      --bg: #141a15; --card: #1e261f; --text: #e8efe8; --muted: #9aa99d;
      --line: #2e3a30; --green: #6cc070; --green-soft: #22352a;
      --orange: #f0a65a; --orange-soft: #3a2c1c; --red: #ef7b6e;
      --blue: #9cc0f0; --blue-soft: #1f2c3f; --blue-bar: #5b8fd6;
    }
  }
  :root[data-theme="dark"] { color-scheme: dark;
    --bg: #141a15; --card: #1e261f; --text: #e8efe8; --muted: #9aa99d;
    --line: #2e3a30; --green: #6cc070; --green-soft: #22352a;
    --orange: #f0a65a; --orange-soft: #3a2c1c; --red: #ef7b6e;
    --blue: #9cc0f0; --blue-soft: #1f2c3f; --blue-bar: #5b8fd6; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding-block: 16px 80px;
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.5); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 100; }
  .dialog { background: var(--card); color: var(--text); border-radius: 14px; padding: 18px; max-width: 420px; width: 100%; max-height: 90vh; overflow: auto; }
  .dialog p { margin: 0 0 14px; }
  button.danger-bg { background: var(--red); border-color: var(--red); color: #fff; }
  h1 { font-size: 1.5rem; margin: 4px 0 16px; display: flex; align-items: center; gap: 8px; }
  h2 { font-size: 1.1rem; margin: 0 0 10px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; margin-bottom: 14px; }
  .muted { color: var(--muted); font-size: .9rem; }
  .badge { display: inline-block; font-size: .75rem; font-weight: 700; padding: 2px 8px; border-radius: 99px; text-transform: uppercase; letter-spacing: .03em; }
  .b-amigos { background: var(--blue-soft); color: var(--blue); }
  .b-torneo { background: var(--orange-soft); color: var(--orange); }
  button, .btn { font: inherit; border: 1px solid var(--line); background: var(--card); color: var(--text);
    border-radius: 10px; padding: 8px 12px; cursor: pointer; text-decoration: none; display: inline-block; }
  button.primary { background: var(--green); border-color: var(--green); color: #fff; font-weight: 600; }
  button.small { padding: 4px 9px; font-size: .9rem; }
  button.danger { color: var(--red); }
  button.light { background: var(--green-soft); color: var(--green); border-color: var(--green-soft); font-weight: 600; }
  .cgrid { display: grid; grid-template-columns: minmax(0,.7fr) minmax(0,1fr) minmax(0,1fr) minmax(0,1.3fr) 36px; gap: 6px; align-items: center; }
  .lgrid { display: grid; grid-template-columns: minmax(0,1fr) 58px 58px 84px; gap: 6px; align-items: center; }
  .cgrid input, .lgrid input { width: 100%; min-width: 0; padding: 8px 6px; font-size: .9rem; }
  .ghead { font-size: .78rem; color: var(--muted); margin-bottom: 4px; }
  .lrow { padding: 7px 0; border-bottom: 1px solid var(--line); }
  .lrow .acts { display: flex; gap: 6px; justify-content: flex-end; }
  .manual h2 { margin-top: 22px; padding-bottom: 4px; border-bottom: 2px solid var(--blue-soft); color: var(--blue); }
  .manual h3 { font-size: 1rem; margin: 16px 0 4px; }
  .manual p, .manual li { max-width: 65ch; }
  .manual ol, .manual ul { padding-left: 22px; margin: 4px 0 8px; }
  .manual code { background: var(--bg); padding: 1px 5px; border-radius: 4px; }
  a.linkbtn { display: inline; }
  .logo { width: 52px; height: 52px; border-radius: 50%; flex-shrink: 0; }
  .linkbtn { background: none; border: none; padding: 0; color: var(--muted); text-decoration: underline; font-size: .85rem; cursor: pointer; }
  .linkbtn.danger { color: var(--red); }
  .evlinks { margin-top: 10px; display: flex; gap: 14px; flex-wrap: wrap; }
  button.ok { color: var(--green); border-color: var(--green); font-weight: 700; }
  button.ok.on { background: var(--green); color: #fff; }
  .pend { font-size: .75rem; color: var(--muted); }
  .confnote { margin-top: 10px; padding: 8px 10px; border-radius: 10px; font-size: .9rem; }
  .confnote.open { background: var(--blue-soft); color: var(--blue); font-weight: 600; }
  .confnote.wait { background: var(--bg); color: var(--muted); }
  button:disabled { opacity: .4; cursor: default; }
  input, select, textarea { font: inherit; padding: 8px 10px; border: 1px solid var(--line); border-radius: 10px;
    background: var(--bg); color: var(--text); min-width: 0; }
  input[type=number] { width: 64px; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .grow { flex: 1; }
  .list { list-style: none; margin: 0 0 10px; padding: 0; }
  .list li { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 1px solid var(--line); }
  .list li:last-child { border-bottom: none; }
  .num { width: 28px; height: 28px; border-radius: 50%; background: var(--blue-soft); color: var(--blue);
    display: inline-flex; align-items: center; justify-content: center; font-weight: 700; font-size: .85rem; flex-shrink: 0; }
  .rest { color: #e8590c; font-weight: 700; }
  .event-link { display: block; color: inherit; text-decoration: none; }
  .etable { display: grid; grid-template-columns: auto minmax(0,1fr) auto 40px; align-items: stretch; }
  .etable > span { padding-right: 10px; }
  .etable > span:last-child, .etable .acts { padding-right: 0; }
  .etable a { color: inherit; font-weight: 700; text-decoration: none; }
  .etable a:hover { color: var(--green); text-decoration: underline; }
  .etable .cell { padding-top: 9px; padding-bottom: 2px; min-width: 0; overflow-wrap: anywhere; display: flex; align-items: center; }
  .etable .cell.date { white-space: nowrap; }
  .etable .names { display: block; grid-column: 1 / -1; padding-top: 2px; font-size: .88rem; color: var(--muted); }
  .etable .num-c { justify-content: center; }
  .etable .num-c { text-align: center; font-variant-numeric: tabular-nums; }
  .etable .acts { grid-column: 1 / -1; flex-direction: row; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: 4px 16px;
    padding-top: 2px; padding-bottom: 9px; border-bottom: 1px solid var(--line); }
  /* Pantalla principal */
  .card { box-shadow: 0 1px 3px rgba(0,0,0,.05); }
  button { transition: filter .15s, transform .05s; }
  button:active, .btn:active { transform: scale(.97); }
  .hero { display: flex; align-items: center; gap: 12px; padding: 14px; margin-bottom: 14px; border-radius: 16px; color: #fff;
    background: linear-gradient(135deg, #1e3a5f 0%, #12283f 100%); box-shadow: 0 2px 8px rgba(18,40,63,.3); }
  .evhero { padding: 16px; margin-bottom: 14px; border-radius: 16px; color: #fff;
    background: linear-gradient(135deg, #1e3a5f 0%, #12283f 100%); box-shadow: 0 2px 8px rgba(18,40,63,.3); }
  .evhero h1 { margin: 8px 0 4px; color: #fff; font-size: 1.5rem; }
  .evhero .pill { display: inline-block; font-size: .72rem; font-weight: 700; letter-spacing: .05em; text-transform: uppercase;
    padding: 3px 10px; border-radius: 99px; background: rgba(255,255,255,.18); }
  .evhero .sub { font-size: .92rem; opacity: .9; }
  .evhero .linkbtn { color: #fff; opacity: .85; }
  .evhero .confnote { background: rgba(255,255,255,.14); color: #fff; }
  .hero .logo { width: 52px; height: 52px; border: 2px solid rgba(255,255,255,.7); background: #fff; }
  .hero-t { flex: 1; min-width: 0; }
  .hero h1 { margin: 0; font-size: 1.45rem; line-height: 1.15; color: #fff; }
  .hero-s { font-size: .85rem; opacity: .85; }
  .hero-help { background: rgba(255,255,255,.16); color: #fff; border-color: rgba(255,255,255,.35); flex-shrink: 0; align-self: flex-start; }
  .hero .logo { cursor: default; -webkit-tap-highlight-color: transparent; }
  .tabs { display: flex; gap: 8px; overflow-x: auto; padding: 2px 1px 8px; margin-bottom: 6px; scrollbar-width: none; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab { flex: 0 0 auto; padding: 9px 16px; border-radius: 99px; font-weight: 600; white-space: nowrap; }
  .tab.on { background: var(--blue); border-color: var(--blue); color: #fff; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .tab.on { color: #0f1a2b; } }
  .orgbar { background: var(--orange-soft); color: var(--text); border: 1px solid var(--orange); border-radius: 12px; padding: 10px 12px; margin: -6px 0 14px; }
  .orgbtns { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }  .hero button { background: rgba(255,255,255,.16); color: #fff; border-color: rgba(255,255,255,.35); flex-shrink: 0; }
  .actions .big { padding: 11px 16px; font-size: 1rem; }
  .btn.ghost { background: transparent; color: var(--muted); }
  .sec-head { font-size: .8rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 6px 2px 8px; }
  .ev { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; margin-bottom: 12px; box-shadow: 0 1px 3px rgba(0,0,0,.05); }
  .ev-top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .ev-date { font-size: 1.15rem; font-weight: 800; }
  .ev-count { font-size: 1.15rem; font-weight: 800; color: var(--blue); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .ev-count span { font-size: .75rem; font-weight: 500; color: var(--muted); }
  .ev-count.sobra { color: var(--red); } .ev-count.ok { color: var(--green); }
  .bar { height: 7px; border-radius: 99px; background: var(--line); overflow: hidden; margin: 8px 0 6px; }
  .bar i { display: block; height: 100%; background: var(--blue-bar); border-radius: 99px; transition: width .3s; }
  .bar.sobra i { background: var(--red); } .bar.ok i { background: var(--green); }
  .ev-meta { font-size: .85rem; color: var(--muted); }
  .st.falta { color: var(--blue); } .st.sobra { color: var(--red); } .st.ok { color: var(--green); }
  .ev-status { margin-top: 6px; font-size: .9rem; font-weight: 700; }
  .ev-status.falta { color: var(--blue); } .ev-status.sobra { color: var(--red); } .ev-status.ok { color: var(--green); }
  .status-pill { display: inline-block; margin-top: 10px; padding: 5px 12px; border-radius: 99px; font-size: .88rem; font-weight: 700; }
  .status-pill.ok { background: #bfe5c1; color: #12401a; } .status-pill.falta { background: #bcd4f5; color: #12284a; } .status-pill.sobra { background: #f6b4ac; color: #5a130b; }
  .ev-names { margin-top: 8px; font-size: .92rem; line-height: 1.6; }
  .ev-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--line); }
  .ev-actions .light { padding: 10px 14px; }
  .ev-actions .linkbtn { padding: 6px 4px; }
  .ev-sp { flex: 1; }
  .empty { text-align: center; padding: 26px 12px; background: var(--card); border: 1px dashed var(--line); border-radius: 14px; font-size: 1.05rem; margin-bottom: 12px; }
  .tag { font-size: .7rem; font-weight: 700; text-transform: uppercase; letter-spacing: .03em; margin-right: 6px; }
  .tag-amigos { color: var(--blue); } .tag-torneo { color: var(--orange); }
  .sec-title { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .event-link:hover b, .event-link:hover div { color: var(--green); }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
  .totals { background: var(--blue-soft); border-radius: 10px; padding: 10px; font-weight: 600; }
  .demo { background: var(--orange-soft); color: var(--orange); border-radius: 10px; padding: 8px 12px; font-size: .85rem; margin-bottom: 14px; }
  .toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: #222; color: #fff;
    padding: 10px 16px; border-radius: 10px; font-size: .95rem; z-index: 99; max-width: 90vw; }
  form.stack { display: grid; gap: 10px; }
  form.stack label { display: grid; gap: 4px; font-size: .9rem; color: var(--muted); }
  .seg { display: flex; gap: 6px; }
  .seg button.on { background: var(--green); color: #fff; border-color: var(--green); }
  .seg button.on.no { background: var(--red); border-color: var(--red); }
  /* Tarjeta para la imagen (siempre en claro) */
  .share { position: fixed; left: -10000px; top: 0; width: 480px; background: #fff; color: #1d2a1f;
    font: 16px/1.4 system-ui, "Segoe UI", Roboto, sans-serif; padding: 22px; }
  .share h3 { margin: 0 0 4px; font-size: 1.3rem; }
  .share .sec { margin-top: 14px; font-weight: 700; color: #1e3a5f; border-bottom: 2px solid #e4ecf7; padding-bottom: 3px; }
  .share ol, .share ul { margin: 6px 0 0; padding-left: 24px; }
  .share .tot { margin-top: 8px; background: #e4ecf7; padding: 8px; border-radius: 8px; font-weight: 600; }
</style>

const DEMO = !SUPABASE_URL || !SUPABASE_KEY;
const sb = DEMO ? null : supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const $app = document.getElementById("app");
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random());
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const today = () => new Date().toISOString().slice(0, 10);
const fmtDate = d => { const t = new Date(d + "T12:00:00").toLocaleDateString("es-ES", { weekday: "long", day: "numeric", month: "long" }); return t.charAt(0).toUpperCase() + t.slice(1); };
const kidsTxt = k => k + (k === 1 ? " niño" : " niños");
const DAY = 86400000;
const daysTo = d => Math.round((new Date(d + "T12:00:00") - new Date(today() + "T12:00:00")) / DAY);
const minusDays = (d, n) => new Date(new Date(d + "T12:00:00") - n * DAY).toISOString().slice(0, 10);
const CONFIRM_DAYS = 7; // la confirmación se abre una semana antes
const courtName = n => /^\d+$/.test(String(n).trim()) ? "Pista " + String(n).trim() : n;
const hasLunch = ev => ev.type === "torneo";   // la comida llegará en la fase 2, con los torneos
const confirmOpen = ev => ev.type === "torneo" && daysTo(ev.date) <= CONFIRM_DAYS;
// "9" -> "09:00", "930" -> "09:30", "9:5" -> "09:05", "21h" -> "21:00"; devuelve null si no es una hora válida
function normTime(v) {
  v = String(v || "").trim().toLowerCase().replace(/h$/, "");
  if (!v) return "";
  let m = v.match(/^(\d{1,2})(?:[:.,h ](\d{1,2}))?$/) || v.match(/^(\d{1,2})(\d{2})$/);
  if (!m) return null;
  const h = +m[1], mi = m[2] === undefined ? 0 : +m[2];
  if (h > 23 || mi > 59) return null;
  return String(h).padStart(2, "0") + ":" + String(mi).padStart(2, "0");
}
// Al salir de un campo de hora se completa sola; devuelve false si alguna no es válida
function fixTimes(form) {
  for (const i of form.querySelectorAll("[data-time]")) {
    const t = normTime(i.value);
    if (t === null) { toast("Hora no válida: escribe por ejemplo 9, 9:30 o 21:00."); i.focus(); return false; }
    i.value = t;
  }
  return true;
}
document.addEventListener("focusout", e => {
  if (e.target.matches && e.target.matches("[data-time]")) { const t = normTime(e.target.value); if (t) e.target.value = t; }
});
// Dobles: 4 jugadores por pista. El jugador nº i (desde 0) queda fuera si i >= pistas × 4
const PLAYERS_PER_COURT = 4;
const overflow = (i, courtsCount) => i >= (courtsCount || 0) * PLAYERS_PER_COURT;
// Estado de cuadre entre jugadores y pistas: { text, ok }
function courtStatus(n, courts) {
  const plazas = courts * PLAYERS_PER_COURT;
  if (n === plazas) return { ok: true, kind: "ok", text: "Completo" };
  if (n > plazas) return { ok: false, kind: "sobra", text: `${n - plazas} en espera` };
  return { ok: false, kind: "falta", text: `Faltan ${plazas - n}` };
}
const normName =s => String(s).normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/\s+/g, " ").trim().toLowerCase();
// El enlace que se comparte lleva siempre a la pantalla principal (sin la convocatoria concreta)
// Con una sola convocatoria abierta el enlace es el de la web; con varias, lleva a la pestaña de esa convocatoria
let upcomingCount = 0;
const eventUrl = id => { const base = location.href.split("#")[0]; return id && upcomingCount > 1 ? base + "#/e/" + id : base; };
const TYPE = { amigos: "Sábados Pitamo", torneo: "Torneo CR8" };
const mapsUrl = a => "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(a);

function getMyName() { try { return localStorage.getItem("tenis-nombre") || ""; } catch (e) { return ""; } }
function setMyName(n) { try { localStorage.setItem("tenis-nombre", n); } catch (e) {} }


/* ---------- Almacén: modo prueba (localStorage) ---------- */
const LocalStore = {
  load() {
    try { return JSON.parse(localStorage.getItem("tenis-demo-" + APP_ID)) || { events: [], courts: [], players: [], lunch: [] }; }
    catch (e) { return { events: [], courts: [], players: [], lunch: [] }; }
  },
  save(d) { try { localStorage.setItem("tenis-demo-" + APP_ID, JSON.stringify(d)); } catch (e) {} },
  async listEvents() {
    const d = this.load();
    return d.events.map(e => { const ps = d.players.filter(p => p.event_id === e.id); return { ...e, players_count: ps.length, player_names: ps.map(p => p.name), courts_count: d.courts.filter(c => c.event_id === e.id).length }; })
      .sort((a, b) => a.date.localeCompare(b.date));
  },
  async getEvent(id) {
    const d = this.load(); const ev = d.events.find(e => e.id === id); if (!ev) return null;
    return { ...ev,
      courts: d.courts.filter(c => c.event_id === id).sort((a, b) => (a.start_time || "").localeCompare(b.start_time || "")),
      players: d.players.filter(p => p.event_id === id).sort((a, b) => a.position - b.position),
      lunch: d.lunch.filter(l => l.event_id === id).sort((a, b) => a.created_at.localeCompare(b.created_at)) };
  },
  async insert(t, row) { const d = this.load(); const r = { ...row, id: uid(), created_at: new Date().toISOString() }; d[t].push(r); this.save(d); return r; },
  async update(t, id, patch) { const d = this.load(); const r = d[t].find(x => x.id === id); if (r) Object.assign(r, patch); this.save(d); },
  async remove(t, id) {
    const d = this.load(); d[t] = d[t].filter(x => x.id !== id);
    if (t === "events") for (const k of ["courts", "players", "lunch"]) d[k] = d[k].filter(x => x.event_id !== id);
    this.save(d);
  }
};

/* ---------- Almacén: Supabase (compartido) ---------- */
const SupaStore = {
  async listEvents() {
    const { data, error } = await sb.from("events").select("*, players(name, created_at, position), courts(id)").order("date");
    if (error) throw error;
    return data.map(e => {
      const list = (e.players || []).slice().sort((a, b) => (a.created_at || "").localeCompare(b.created_at || "") || a.position - b.position);
      return { ...e, players_count: list.length, player_names: list.map(p => p.name), courts_count: (e.courts || []).length };
    });
  },
  async getEvent(id) {
    const [e, c, p, l] = await Promise.all([
      sb.from("events").select("*").eq("id", id).maybeSingle(),
      sb.from("courts").select("*").eq("event_id", id).order("start_time"),
      sb.from("players").select("*").eq("event_id", id).order("created_at").order("position"),
      sb.from("lunch").select("*").eq("event_id", id).order("created_at")]);
    for (const r of [e, c, p, l]) if (r.error) throw r.error;
    if (!e.data) return null;
    return { ...e.data, courts: c.data, players: p.data, lunch: l.data };
  },
  async insert(t, row) { const { data, error } = await sb.from(t).insert(row).select().single(); if (error) throw error; return data; },
  async update(t, id, patch) { const { error } = await sb.from(t).update(patch).eq("id", id); if (error) throw error; },
  async remove(t, id) { const { error } = await sb.from(t).delete().eq("id", id); if (error) throw error; }
};
const rawStore = DEMO ? LocalStore : SupaStore;

/* ---------- Registro de movimientos (oculto; se ve con la clave del organizador) ---------- */
const LOG_KEY = "tenis-movs-" + APP_ID;
async function getRow(t, id) {
  if (DEMO) return LocalStore.load()[t].find(x => x.id === id) || null;
  const { data } = await sb.from(t).select("*").eq("id", id).maybeSingle(); return data;
}
const evLabelCache = {};
async function evLabel(eventId) {
  if (!eventId) return "";
  if (!evLabelCache[eventId]) { const e = await getRow("events", eventId); if (e) evLabelCache[eventId] = fmtDate(e.date); }
  return evLabelCache[eventId] || "";
}
async function logMove(text) {   // nunca debe estropear la acción principal
  try {
    const row = { text, who: getMyName() || null };
    if (DEMO) { const l = JSON.parse(localStorage.getItem(LOG_KEY) || "[]"); l.unshift({ ...row, created_at: new Date().toISOString() }); localStorage.setItem(LOG_KEY, JSON.stringify(l.slice(0, 300))); }
    else { const { error } = await sb.from("movimientos").insert(row); if (error) console.warn("movimientos:", error.message); }
  } catch (e) { console.warn(e); }
}
async function describe(kind, t, row, patch) {
  if (!row) return null;
  const when = t === "events" ? fmtDate(row.date) : await evLabel(row.event_id);
  const at = when ? ` (${when})` : "";
  if (t === "events") {
    if (kind === "insert") return `Creada convocatoria del ${when}`;
    if (kind === "remove") return `BORRADA convocatoria del ${when}`;
    if (patch && "archived" in patch) return `${patch.archived ? "Archivada" : "Recuperada"} convocatoria del ${when}`;
    if (patch && "lunch_enabled" in patch) return `${patch.lunch_enabled ? "Activada" : "Quitada"} la comida en la convocatoria del ${when}`;
    return `Editada convocatoria del ${when}`;
  }
  if (t === "players") {
    if (kind === "insert") return `Apuntado: ${row.name}${at}`;
    if (kind === "remove") return `Quitado jugador: ${row.name}${at}`;
    return `${patch?.confirmed ? "Confirmado" : "Desconfirmado"}: ${row.name}${at}`;
  }
  if (t === "courts") {
    const c = `${courtName(row.name)} ${row.start_time || ""}${row.end_time ? "–" + row.end_time : ""}${row.booked_by ? ", reservada por " + row.booked_by : ""}`;
    if (kind === "update") return `Modificada pista (antes: ${c}; ahora: ${courtName(patch.name)} ${patch.start_time}–${patch.end_time}, reservada por ${patch.booked_by})${at}`;
    return kind === "insert" ? `Añadida pista: ${c}${at}` : `Quitada pista: ${c}${at}`;
  }
  if (t === "lunch") {
    if (kind === "insert") return `Apuntado a la comida: ${row.name}${at}`;
    if (kind === "remove") return `Quitado de la comida: ${row.name}${at}`;
    return `Comida, cambio de ${row.name}: ${Object.entries(patch || {}).map(([k, v]) => ({ adults: "adultos", kids: "niños", confirmed: "confirmado" }[k] || k) + " = " + v).join(", ")}${at}`;
  }
  return null;
}
const store = {
  listEvents: () => rawStore.listEvents(),
  getEvent: id => rawStore.getEvent(id),
  async insert(t, row) { const r = await rawStore.insert(t, row); describe("insert", t, r).then(m => m && logMove(m)); return r; },
  async update(t, id, patch) {
    const before = await getRow(t, id).catch(() => null);
    await rawStore.update(t, id, patch);
    describe("update", t, before, patch).then(m => m && logMove(m));
  },
  async remove(t, id) {
    const before = await getRow(t, id).catch(() => null);
    const m = await describe("remove", t, before).catch(() => null);
    await rawStore.remove(t, id);
    if (m) logMove(m);
  }
};

/* ---------- Utilidades de interfaz ---------- */
function toast(msg) {
  const t = document.createElement("div"); t.className = "toast"; t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), 3200);
}
async function act(fn) {
  try { await fn(); await render(); }
  catch (e) { console.error(e); toast("Error: " + (e.message || e)); }
}
function overlay(html) {
  const o = document.createElement("div"); o.className = "overlay";
  o.innerHTML = `<div class="dialog">${html}</div>`; document.body.appendChild(o); return o;
}
function askConfirm(msg, yes = "Sí, quitar") {
  return new Promise(res => {
    const o = overlay(`<p>${esc(msg)}</p><div class="row" style="justify-content:flex-end">
      <button id="cNo">Cancelar</button><button class="danger-bg" id="cYes">${esc(yes)}</button></div>`);
    o.querySelector("#cNo").onclick = () => { o.remove(); res(false); };
    o.querySelector("#cYes").onclick = () => { o.remove(); res(true); };
  });
}
let adminOk = false, histOk = false; // las claves se piden una vez por visita
function askKey(what, always = false, key = ADMIN_KEY) {
  const isHist = key === HISTORY_KEY;
  if ((isHist ? histOk : adminOk) && !always) return Promise.resolve(true);
  return new Promise(res => {
    const o = overlay(`<p>🔒 ${esc(what)} está reservado${isHist ? "" : " al organizador"}. Introduce la clave:</p>
      <form id="keyform" class="row"><input id="keyin" type="password" inputmode="numeric" autocomplete="off" class="grow" aria-label="Clave">
      <button class="primary" type="submit">Aceptar</button><button type="button" id="keyno">Cancelar</button></form>`);
    const i = o.querySelector("#keyin"); i.focus();
    o.querySelector("#keyno").onclick = () => { o.remove(); res(false); };
    o.querySelector("#keyform").onsubmit = e => {
      e.preventDefault();
      if (i.value === key) { if (isHist) histOk = true; else adminOk = true; o.remove(); res(true); }
      else { i.value = ""; i.placeholder = "Clave incorrecta"; i.focus(); }
    };
  });
}
function showImage(blob, onClose, label = "Hecho, salir") {
  const url = URL.createObjectURL(blob);
  const o = overlay(`<p>Mantén pulsada la imagen (en el ordenador, clic derecho) y elige «Copiar imagen». Después pégala en el grupo de WhatsApp.</p>
    <img src="${url}" alt="Resumen de la convocatoria" style="width:100%;border-radius:8px;border:1px solid var(--line)">
    <div class="row" style="justify-content:flex-end;margin-top:12px"><button class="primary" id="iClose">${esc(label)}</button></div>`);
  o.querySelector("#iClose").onclick = () => { o.remove(); URL.revokeObjectURL(url); if (onClose) onClose(); };
}
function showLink(link) {
  const o = overlay(`<p>Copia este enlace y pégalo en WhatsApp:</p>
    <input id="linkbox" readonly value="${esc(link)}" style="width:100%">
    <div class="row" style="justify-content:flex-end;margin-top:12px"><button id="lClose">Cerrar</button></div>`);
  const i = o.querySelector("#linkbox"); i.focus(); i.select();
  o.querySelector("#lClose").onclick = () => o.remove();
}
const demoBanner = () => DEMO ? `<div class="demo">Modo prueba: los datos solo se guardan en este navegador.</div>` : "";

/* ---------- Cabecera común, modo organizador y pestañas ---------- */
let orgMode = false;   // modo organizador: se entra pulsando el logo + clave; se pide una vez por visita
const shortDate = d => { const t = new Date(d + "T12:00:00").toLocaleDateString("es-ES", { weekday: "short", day: "numeric", month: "short" }).replace(/\./g, ""); return t.charAt(0).toUpperCase() + t.slice(1); };
const upcomingOf = events => { const t = today(); return events.filter(e => !e.archived && e.date >= t); };

function headerHtml() {
  return `<div class="hero">
      <img src="${LOGO}" alt="Logo FT-CR8" class="logo" id="logo">
      <div class="hero-t"><h1>${esc(APP_TITLE)}</h1><div class="hero-s">Pistas y jugadores</div></div>
      <a href="#/ayuda" class="btn small hero-help">📖 Manual</a>
    </div>
    ${orgMode ? `<div class="orgbar"><b>🔧 Modo organizador</b>
      <div class="orgbtns">
        <button class="small" id="o-manage">Convocatorias</button>
        <button class="small" id="o-movs">🕓 Historial</button>
        <button class="small danger" id="o-exit">Salir del modo organizador</button>
      </div></div>` : ""}
    ${demoBanner()}`;
}
function bindHeader() {
  const go = (id, hash) => { const el = document.getElementById(id); if (el) el.onclick = () => { location.hash === hash ? render() : (location.hash = hash); }; };
  const logo = document.getElementById("logo");
  if (logo) logo.onclick = async () => { if (!orgMode && await askKey("El modo organizador")) { orgMode = true; render(); } };
  go("o-manage", "#/gestion");
  const mv = document.getElementById("o-movs");
  if (mv) mv.onclick = async () => { if (await askKey("El historial", false, HISTORY_KEY)) { location.hash === "#/movimientos" ? render() : (location.hash = "#/movimientos"); } };
  const ex = document.getElementById("o-exit");
  if (ex) ex.onclick = () => { orgMode = false; editing = false; showNewForm = false; history.replaceState(null, "", location.pathname + location.search + "#/"); render(); window.scrollTo(0, 0); };
}
function tabsHtml(upcoming, activeId) {
  if (upcoming.length < 2) return "";
  return `<div class="tabs" role="tablist">${upcoming.map(e => `<button class="tab ${e.id === activeId ? "on" : ""}" role="tab" data-tab="${e.id}">${esc(shortDate(e.date))} · ${e.type === "torneo" ? "CR8" : "Pitamo"}</button>`).join("")}</div>`;
}
function bindTabs() {
  document.querySelectorAll("[data-tab]").forEach(el => el.onclick = () => { editing = false; location.hash = "#/e/" + el.dataset.tab; });
}

/* ---------- Pantalla de inicio: la próxima convocatoria ---------- */
async function renderMain() {
  const upcoming = upcomingOf(await store.listEvents());
  upcomingCount = upcoming.length;
  if (upcoming.length) { await renderEvent(upcoming[0].id, upcoming); return; }
  $app.innerHTML = `${headerHtml()}
    <div class="empty">🎾<br><b>No hay convocatorias abiertas</b><br><span class="muted">Cuando el organizador cree la próxima, aparecerá aquí.</span></div>
    ${orgMode ? `<div class="actions"><button class="primary big" id="new">${showNewForm ? "✕ Cancelar" : "+ Crear convocatoria"}</button></div>
      ${showNewForm ? `<div class="card">${eventForm()}</div>` : ""}` : ""}`;
  bindHeader();
  const nb = document.getElementById("new"); if (nb) nb.onclick = () => { showNewForm = !showNewForm; render(); };
  if (showNewForm && orgMode) bindEventForm(null);
}

/* ---------- Pantalla del organizador: gestión de convocatorias ---------- */
let showPast = false, showNewForm = false;

async function renderList() {
  const events = await store.listEvents();
  const t = today();
  const upcoming = upcomingOf(events);
  upcomingCount = upcoming.length;
  const past = events.filter(e => e.archived || e.date < t).reverse();
  // Una tarjeta por convocatoria: fecha y ocupación (barra); debajo, los botones. Sin nombres ni detalle de pistas
  const cards = (list, withType) => list.map(e => {
    const courts = e.courts_count ?? 0, plazas = courts * PLAYERS_PER_COURT, n = e.players_count ?? 0;
    const pct = plazas ? Math.min(100, Math.round(n / plazas * 100)) : 0;
    return `<div class="ev">
      <div class="ev-top">
        <div class="ev-date">${withType ? `<span class="tag tag-${e.type}">${e.type === "torneo" ? "CR8" : "Pitamo"}</span> ` : ""}${esc(shortDate(e.date))}</div>
        <div class="ev-count ${courtStatus(n, courts).kind}">${n} <span>${n === 1 ? "jugador" : "jugadores"}</span> / ${plazas} <span>plazas</span></div>
      </div>
      <div class="bar ${courtStatus(n, courts).kind}"><i style="width:${pct}%"></i></div>
      <div class="ev-meta">🎾 ${courts} ${courts === 1 ? "pista" : "pistas"} (4 jugadores por pista)</div>
      <div class="ev-status ${courtStatus(n, courts).kind}">${courtStatus(n, courts).ok ? "✓" : "⚠"} ${courtStatus(n, courts).text}</div>
      <div class="ev-actions">
        <button class="light" data-date="${e.id}" data-d="${esc(e.date)}">📅 Cambiar fecha</button>
        <button class="light" data-copy="${e.id}" title="Copiar imagen y enlace para WhatsApp">📋 Copiar para WhatsApp</button>
        <span class="ev-sp"></span>
        <button class="linkbtn" data-arch="${e.id}" data-v="${e.archived ? 0 : 1}" title="Requiere clave">🔒 ${e.archived ? "Recuperar" : "Archivar"}</button>
        ${e.archived ? `<button class="linkbtn danger" data-del="${e.id}" title="Borrar (requiere clave)">🔒 Borrar</button>` : ""}
      </div>
    </div>`;
  }).join("");
  const section = type => {
    const list = upcoming.filter(e => e.type === type);
    return `<div class="sec-head">${TIPOS.length > 1 ? esc(TYPE[type]) + " · " : ""}Próximas convocatorias</div>
      ${list.length ? cards(list, false) : `<div class="empty">🎾<br>No hay convocatorias próximas.<br><span class="muted">Pulsa «+ Nueva convocatoria» para crear la del próximo sábado.</span></div>`}`;
  };
  $app.innerHTML = `
    ${headerHtml()}
    <div class="actions"><button class="primary big" id="new">${showNewForm ? "✕ Cancelar" : "+ Nueva convocatoria"}</button></div>
    ${showNewForm ? `<div class="card">${eventForm()}</div>` : ""}
    ${TIPOS.map(section).join("")}
    ${past.length ? `<div style="text-align:center;margin-top:8px"><button class="linkbtn" id="past">${showPast ? "Ocultar" : "Ver"} archivadas y pasadas (${past.length})</button></div>
      ${showPast ? `<div style="margin-top:12px;opacity:.85">${cards(past, true)}</div>` : ""}` : ""}`;
  bindHeader();
  document.getElementById("new").onclick = () => { showNewForm = !showNewForm; render(); };
  const p = document.getElementById("past"); if (p) p.onclick = () => { showPast = !showPast; render(); };
  if (showNewForm) bindEventForm(null);
  document.querySelectorAll("[data-date]").forEach(el => el.onclick = () => {
    const o = overlay(`<p><b>Cambiar la fecha</b> de la convocatoria:</p>
      <form id="dform" class="row"><input type="date" id="din" required class="grow" value="${esc(el.dataset.d)}">
      <button class="primary" type="submit">Guardar</button><button type="button" id="dno">Cancelar</button></form>`);
    o.querySelector("#dno").onclick = () => o.remove();
    o.querySelector("#dform").onsubmit = e => {
      e.preventDefault(); const v = o.querySelector("#din").value; o.remove();
      if (v && v !== el.dataset.d) act(() => store.update("events", el.dataset.date, { date: v }));
    };
  });
  document.querySelectorAll("[data-copy]").forEach(el => el.onclick = () => sendToWhatsApp(() => store.getEvent(el.dataset.copy)));
  document.querySelectorAll("[data-arch]").forEach(el => el.onclick = async () => {
    const arch = el.dataset.v === "1";
    if (!(await askKey(arch ? "Archivar convocatorias" : "Recuperar convocatorias"))) return;
    const ok = await askConfirm(arch
      ? "Vas a archivar esta convocatoria: dejará de verse en la lista principal. No se borra nada; podrás recuperarla en «Ver archivadas y pasadas»."
      : "¿Recuperar esta convocatoria? Volverá a la lista principal.", arch ? "Sí, archivar" : "Sí, recuperar");
    if (ok) act(async () => {
      await store.update("events", el.dataset.arch, { archived: arch });
      toast(arch ? "Convocatoria archivada" : "Convocatoria recuperada");
    });
  });
  document.querySelectorAll("[data-del]").forEach(el => el.onclick = async () => {
    if (!(await askKey("Borrar convocatorias", true))) return; // la clave se pide siempre para borrar
    if (await askConfirm("¿Borrar definitivamente esta convocatoria con sus pistas y apuntados? No se puede deshacer."))
      act(() => store.remove("events", el.dataset.del));
  });
}

function eventForm(ev) {
  const type = ev?.type || TIPOS[0];
  return `<form class="stack" id="evform">
    <h2>${ev ? "Editar convocatoria" : "Nueva convocatoria"}</h2>
    <label style="${TIPOS.length > 1 ? "" : "display:none"}">Tipo
      <select name="type">
        ${TIPOS.map(t => `<option value="${t}" ${type === t ? "selected" : ""}>${TYPE[t]}</option>`).join("")}
      </select></label>
    <label>Fecha <input type="date" name="date" required value="${esc(ev?.date || "")}"></label>
    ${ev ? "" : `<div id="firstcourt" style="display:${type === "amigos" ? "block" : "none"}">
      <div class="ghead" style="font-weight:600;margin-bottom:6px">🎾 Primera pista reservada (obligatoria en Sábados Pitamo)</div>
      <div class="cgrid ghead" style="grid-template-columns:minmax(0,.7fr) minmax(0,1fr) minmax(0,1fr) minmax(0,1.3fr)"><span>Pista</span><span>Hora inicio</span><span>Hora fin</span><span>Reservado por</span></div>
      <div class="cgrid" style="grid-template-columns:minmax(0,.7fr) minmax(0,1fr) minmax(0,1fr) minmax(0,1.3fr)">
        <input name="c_name" placeholder="Nº" aria-label="Pista">
        <input name="c_start" inputmode="numeric" autocomplete="off" placeholder="hh:mm" data-time aria-label="Hora inicio">
        <input name="c_end" inputmode="numeric" autocomplete="off" placeholder="hh:mm" data-time aria-label="Hora fin">
        <input name="c_by" placeholder="Nombre" aria-label="Reservado por">
      </div>
      <div class="muted" style="margin-top:4px;font-size:.8rem">Las demás pistas se añaden después, dentro de la convocatoria.</div>
    </div>`}
    <div id="lunchfields" class="stack" style="display:${type === "torneo" ? "grid" : "none"};gap:10px">
    <div class="ghead" style="margin-top:4px;font-weight:600">🍽️ Comida (puede ponerse más tarde)</div>
    <label>Restaurante <input name="restaurant" placeholder="Ej.: Venta El Cruce" value="${esc(ev?.restaurant || "")}"></label>
    <label>Dirección <input name="address" placeholder="Ej.: Ctra. de Utrera km 3, Dos Hermanas" value="${esc(ev?.address || "")}"></label>
    <label>Hora de la reserva <input name="meal_time" inputmode="numeric" autocomplete="off" placeholder="hh:mm" data-time value="${esc(ev?.meal_time || "")}"></label>
    </div>
    <div class="row"><button class="primary" type="submit">Guardar</button>
      <button type="button" id="evcancel">Cancelar</button></div>
  </form>`;
}

function bindEventForm(ev) {
  const f = document.getElementById("evform");
  const fc = document.getElementById("firstcourt");
  const syncType = () => {
    document.getElementById("lunchfields").style.display = f.type.value === "torneo" ? "grid" : "none";
    if (fc) {
      const need = f.type.value === "amigos";
      fc.style.display = need ? "block" : "none";
      for (const k of ["c_name", "c_start", "c_end", "c_by"]) f[k].required = need;
    }
  };
  f.type.onchange = syncType; syncType();
  document.getElementById("evcancel").onclick = () => { showNewForm = false; editing = false; render(); };
  f.onsubmit = e => {
    e.preventDefault();
    if (!fixTimes(f)) return;
    if (fc && f.type.value === "amigos" && f.c_end.value <= f.c_start.value) {
      toast("La hora fin de la pista tiene que ser posterior a la de inicio."); f.c_end.focus(); return;
    }
    const row = { type: f.type.value, date: f.date.value,
      restaurant: f.restaurant.value.trim() || null, address: f.address.value.trim() || null,
      meal_time: f.meal_time.value || null };
    act(async () => {

}

function bindEvent(ev) {
  const on = (sel, fn) => document.querySelectorAll(sel).forEach(el => el.onclick = () => fn(el));
  bindHeader(); bindTabs();
  if (editing && orgMode) bindEventForm(ev);
  else {
    const ed = document.getElementById("edit");
    if (ed) ed.onclick = () => { editing = true; render(); };
  }
  document.getElementById("done").onclick = () => finish(ev);

  document.getElementById("courtform").onsubmit = e => {
    e.preventDefault(); const f = e.target;
    if (!fixTimes(f)) return;
    if (f.end.value <= f.start.value) { toast("La hora fin tiene que ser posterior a la de inicio."); f.end.focus(); return; }
    act(() => store.insert("courts", { event_id: ev.id, name: f.name.value.trim(), start_time: f.start.value, end_time: f.end.value, booked_by: f.by.value.trim() }));
  };
  // Pistas editables en su propia fila: se guarda al salir del campo
  document.querySelectorAll("[data-crow]").forEach(row => row.addEventListener("change", () => {
    const v = n => row.querySelector(`[name=${n}]`).value.trim();
    const t0 = normTime(v("start")), t1 = normTime(v("end"));
    if (!v("name") || !v("by") || !t0 || !t1) { toast("Todos los campos de la pista son obligatorios y las horas tienen que ser válidas."); render(); return; }
    if (t1 <= t0) { toast("La hora fin tiene que ser posterior a la de inicio."); render(); return; }
    act(() => store.update("courts", row.dataset.crow, { name: v("name"), start_time: t0, end_time: t1, booked_by: v("by") }));
  }));
  on("[data-delcourt]", el => {
    if (ev.type === "amigos" && ev.courts.length <= 1) { toast("En Sábados Pitamo tiene que quedar al menos una pista. Añade otra antes de quitar esta."); return; }
    const c = ev.courts.find(x => x.id === el.dataset.delcourt);
    askConfirm(`¿Quitar ${c ? courtName(c.name) : "esta pista"}?`).then(ok => ok && act(() => store.remove("courts", el.dataset.delcourt))); });

  document.getElementById("playerform").onsubmit = e => {
    e.preventDefault(); const name = e.target.name.value.trim(); setMyName(name);
    if (ev.players.some(p => normName(p.name) === normName(name))) { toast("«" + name + "» ya está apuntado."); return; }
    const pos = ev.players.length ? Math.max(...ev.players.map(p => +p.position)) + 1 : 1;
    act(() => store.insert("players", { event_id: ev.id, name, position: pos, confirmed: false }));
  };
  on("[data-confp]", el => { const p = ev.players.find(x => x.id === el.dataset.confp);
    act(() => store.update("players", p.id, { confirmed: !p.confirmed })); });
  on("[data-delplayer]", el => { const p = ev.players.find(x => x.id === el.dataset.delplayer); askConfirm(`¿Quitar a ${p ? p.name : "este jugador"} de la lista?`).then(ok => ok && act(() => store.remove("players", el.dataset.delplayer))); });

  if (hasLunch(ev)) {
    document.getElementById("lunchform").onsubmit = e => {
      e.preventDefault(); const f = e.target; const name = f.name.value.trim(); setMyName(name);
      act(() => store.insert("lunch", { event_id: ev.id, name, attending: true, confirmed: false,
        adults: Math.max(0, +f.adults.value || 0), kids: Math.max(0, +f.kids.value || 0) }));
    };
    document.querySelectorAll("[data-adults]").forEach(el => el.onchange = () =>
      act(() => store.update("lunch", el.dataset.adults, { adults: Math.max(0, +el.value || 0) })));
    document.querySelectorAll("[data-kids]").forEach(el => el.onchange = () =>
      act(() => store.update("lunch", el.dataset.kids, { kids: Math.max(0, +el.value || 0) })));
    on("[data-confl]", el => { const l = ev.lunch.find(x => x.id === el.dataset.confl);
      act(() => store.update("lunch", l.id, { confirmed: !l.confirmed })); });
    on("[data-dellunch]", el => { askConfirm("¿Quitar a esta persona de la comida?").then(ok => ok && act(() => store.remove("lunch", el.dataset.dellunch))); });
  }
}

async function makeImage(ev) {
  const card = buildShareCard(ev); document.body.appendChild(card);
  try {
    const canvas = await html2canvas(card, { scale: 2, backgroundColor: "#ffffff" });
    return await new Promise(r => canvas.toBlob(r, "image/png"));
  } finally { card.remove(); }
}

// Un solo botón: genera la imagen y la deja lista para WhatsApp, y vuelve a la lista
// Genera la imagen de una convocatoria y la deja lista para WhatsApp.
// getEv: función que devuelve (una promesa de) la convocatoria; after: qué hacer al terminar.
async function sendToWhatsApp(getEv, after = () => {}, closeLabel = "Cerrar") {
  const touch = window.matchMedia && matchMedia("(pointer: coarse)").matches;
  toast("Preparando imagen…");
  try {
    const evP = Promise.resolve(getEv());
    if (touch && navigator.canShare) {
      // Móvil: menú Compartir -> WhatsApp -> grupo. El enlace va como texto (se puede pulsar)
      const ev = await evP;
      const blob = await makeImage(ev);
      const file = new File([blob], "tenis-" + ev.date + ".png", { type: "image/png" });
      if (navigator.canShare({ files: [file] })) {
        // En Android la promesa de share() puede no resolverse al volver de WhatsApp:
        // se vuelve a la pantalla principal en cuanto se abre el menú Compartir.
        try {
          const shared = navigator.share({ files: [file], text: (ev.type === "torneo" ? "Apúntate o confirma aquí: " : "Apúntate aquí: ") + eventUrl(ev.id) });
          after();
          await shared; return;
        } catch (e) { if (e.name === "AbortError") return; }
      }
      showImage(blob, after, closeLabel); return;
    }
    // Ordenador: copia la imagen al portapapeles para pegarla en WhatsApp Web
    try {
      await navigator.clipboard.write([new ClipboardItem({ "image/png": evP.then(makeImage) })]);
      toast("Imagen copiada. Pégala en el grupo de WhatsApp (Ctrl+V).");
      after(); return;
    } catch (e) {}
    showImage(await makeImage(await evP), after, closeLabel);
  } catch (e) { console.error(e); toast("No se pudo crear la imagen: " + e.message); }
}
// Al terminar de compartir se queda en la misma convocatoria (ya no hay lista a la que volver)
const finish = ev => sendToWhatsApp(() => ev, () => { editing = false; render(); }, "Hecho");

      <h3>Crear una convocatoria</h3>
      <ol>
        <li>En modo organizador pulsa <b>Convocatorias</b> y luego <b>+ Nueva convocatoria</b>.</li>
        <li>Elige la <b>fecha</b>.</li>
        <li>Es obligatorio poner la primera pista: número, hora de inicio, hora de fin y quién la ha reservado.</li>
        <li>Pulsa <b>Guardar</b>.</li>
      </ol>

      <h3>Editar, archivar y borrar</h3>
      <ul>
        <li><b>Cambiar la fecha</b>: en la tarjeta de la convocatoria, pulsa <b>📅 Cambiar fecha</b>, elige el día y <b>Guardar</b>.</li>
        <li><b>Archivar</b>: en <b>Convocatorias</b>, <i>🔒 Archivar</i> hace que deje de verse para todos, pero no se borra. Se recupera en <i>Ver archivadas y pasadas</i>. Las convocatorias ya celebradas pasan solas ahí.</li>
        <li><b>Borrar</b>: solo desde <i>Ver archivadas y pasadas</i>; la clave se pide siempre y hay que confirmar. No se puede deshacer.</li>
      </ul>

      <h3>Historial</h3>
      <p>El botón <b>🕓 Historial</b> muestra los últimos movimientos: quién se apunta o se quita y qué se cambia en pistas y convocatorias. Tiene <b>su propia clave</b>, distinta de la del modo organizador.</p>` : ""}
    </div>`;
  bindHeader();
}

async function renderMovs() {
  let list = [], err = "";
  try {
    if (DEMO) list = JSON.parse(localStorage.getItem(LOG_KEY) || "[]");
    else {
      const { data, error } = await sb.from("movimientos").select("*").order("created_at", { ascending: false }).limit(300);
      if (error) err = error.message; else list = data;
    }
  } catch (e) { err = e.message || String(e); }
  const fmt = iso => new Date(iso).toLocaleString("es-ES", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" });
  $app.innerHTML = `
    ${headerHtml()}
    <div class="card">
      <h1>🕓 Movimientos</h1>
      <p class="muted">Lo más reciente arriba (últimos 300). «Desde» es el último nombre escrito en ese móvil u ordenador.</p>
      ${err ? `<p>No se pudo leer el registro: ${esc(err)}.<br>Si es la primera vez, falta crear la tabla «movimientos» en Supabase (ver supabase.sql).</p>` : ""}
      ${list.length ? `<ul class="list">${list.map(x => `<li style="display:block"><span class="muted" style="font-size:.8rem">${esc(fmt(x.created_at))}${x.who ? " · desde " + esc(String(x.who).split("¦")[0]) : ""}</span><br>${esc(x.text)}</li>`).join("")}</ul>`
        : (err ? "" : `<p class="muted">Todavía no hay movimientos.</p>`)}
    </div>`;
  bindHeader();
}

async function render() {
  // Las pantallas del organizador solo existen en modo organizador; fuera de él se vuelve al inicio
  if (!orgMode && ["#/movimientos", "#/gestion"].includes(location.hash)) history.replaceState(null, "", location.pathname + location.search + "#/");
  const m = location.hash.match(/^#\/e\/(.+)$/);
  document.title = APP_TITLE;
  try {
    if (location.hash === "#/ayuda") renderHelp();
    else if (location.hash === "#/movimientos" && histOk) await renderMovs();
    else if (orgMode) await renderList();   // el organizador solo ve la lista de convocatorias, sin el detalle de pistas y jugadores
    else if (m) await renderEvent(m[1]);
    else await renderMain();
  }
  catch (e) { console.error(e); $app.innerHTML = `<div class="card">No se pudieron cargar los datos: ${esc(e.message || e)}</div>`; }
}
window.addEventListener("hashchange", () => { editing = false; showNewForm = false; render(); window.scrollTo(0, 0); });

// Refresca cada 20 s (si no estás escribiendo) para ver lo que apuntan los demás
const typing = () => { const a = document.activeElement; return a && ["INPUT", "SELECT", "TEXTAREA"].includes(a.tagName); };
setInterval(() => { if (!DEMO && !typing() && !editing && !showNewForm && document.visibilityState === "visible") render(); }, 20000);
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && !typing()) render(); });

try { document.querySelectorAll('link[rel="icon"],link[rel="apple-touch-icon"]').forEach(l => l.href = LOGO); } catch (e) {}
render();</script>
</body>
</html>
